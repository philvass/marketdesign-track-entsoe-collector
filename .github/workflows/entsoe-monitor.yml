name: MarketDesign.ai ENTSO-E monitor

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - bootstrap
          - submit
      limit:
        description: Maximum ENTSO-E items to inspect
        required: true
        default: '25'

permissions:
  contents: read

concurrency:
  group: marketdesign-entsoe-monitor
  cancel-in-progress: false

jobs:
  collect:
    # Scheduled production runs are disabled until the repository variable
    # TRACK_AUTOMATION_ENABLED is explicitly set to "true".
    if: github.event_name != 'schedule' || vars.TRACK_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COLLECTOR_STATE: state/entsoe.sqlite3
      TRACK_INGEST_URL: ${{ vars.TRACK_INGEST_URL || 'https://marketdesign-track-api.philvass.workers.dev/ingest/document' }}
      TRACK_INGEST_TOKEN: ${{ secrets.TRACK_INGEST_TOKEN }}

    steps:
      - name: Check out collector
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent collector state
        id: state_restore
        uses: actions/cache/restore@v4
        with:
          path: state/entsoe.sqlite3
          key: entsoe-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            entsoe-state-${{ github.ref_name }}-

      - name: Resolve run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "mode=submit" >> "$GITHUB_OUTPUT"
            echo "limit=25" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
          fi

      - name: ENTSO-E dry run
        if: steps.mode.outputs.mode == 'dry_run'
        run: python collector.py --dry-run --limit "${{ steps.mode.outputs.limit }}" --json | tee run-output.json

      - name: Bootstrap current ENTSO-E catalogue
        if: steps.mode.outputs.mode == 'bootstrap'
        run: python collector.py --bootstrap-state --limit "${{ steps.mode.outputs.limit }}" --json | tee run-output.json

      - name: Submit new or changed ENTSO-E items
        if: steps.mode.outputs.mode == 'submit'
        run: python collector.py --submit --limit "${{ steps.mode.outputs.limit }}" --json | tee run-output.json

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MarketDesign.ai ENTSO-E monitor"
            echo ""
            echo "- Mode: ${{ steps.mode.outputs.mode }}"
            echo "- State cache restored: ${{ steps.state_restore.outputs.cache-matched-key != '' }}"
            echo "- Scheduled automation enabled: ${{ vars.TRACK_AUTOMATION_ENABLED == 'true' }}"
            if [[ -f run-output.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p=Path('run-output.json')
          try:
              d=json.loads(p.read_text())
              results=d.get('results', [])
              print(f"- Discovered: {d.get('discovered_count', 0)}")
              print(f"- Processed: {d.get('processed_count', 0)}")
              print(f"- Submitted: {sum(1 for x in results if x.get('submitted'))}")
              print(f"- Duplicates skipped: {sum(1 for x in results if x.get('duplicate'))}")
              print(f"- Bootstrapped: {sum(1 for x in results if x.get('bootstrapped'))}")
          except Exception as e:
              print(f"- Could not parse run-output.json: {e}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save persistent collector state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state/entsoe.sqlite3
          key: entsoe-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload run report
        if: always() && hashFiles('run-output.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: entsoe-monitor-${{ github.run_id }}
          path: run-output.json
          retention-days: 14
